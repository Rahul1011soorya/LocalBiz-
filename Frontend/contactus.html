<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBiz Connect-Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <header class="topbar">
        <div class="logo">
            LocalBiz Connect
        </div>
        <nav>
            <a href="index.html" >Home</a>
            <a href="dashboard.html" >Dashboard</a>
            <a href="services.html" >Services</a>
            <a href="contactus.html" >Contact Us</a>
            <a href="aboutus.html">About Us</a>
            <a href="student-profile.html">Student Profile</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-title">
            <div >
                <h2 style="color:#123c69">Contact Us</h2>
                <p>Send a service enquiry.Later this form will connect to backend and database.</p>
            </div>
        </section>
        <section class="form-box">

            <form onsubmit="submitEnquiry(event)">

                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Enter your name">

                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="Enter your email">

                

                <label for="service">Service</label>
                <select id="service">
                    <option value="">Select a service</option>
                    <option >Website Design</option>
                    <option >App Development</option>
                    <option >Digital Marketing</option>
                    <option>IT Support</option>
                </select>

                

                <label for="message">message</label>
                <textarea id="message" placeholder="Write your message here"></textarea>

                <button type="submit" class="primary-btn">Submit Enquiry</button>
                <p id="formmessage"></p>

            </form>

        </section>
    </main>
    

    <footer >
        <p>Contact Us-LocalBiz Connect</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
